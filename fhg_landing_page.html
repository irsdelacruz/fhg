  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ic; font-size: 20px; color: #4d5a3f; max-width: 560px; margin: 0 auto 28px; line-height: 1.6;\">\n        “So whatever you eat or drink or whatever you do, do it all for the glory of God”\n        <br><span style=\"font-family: 'Cinzel', serif; font-style: normal; font-size: 12px; letter-spacing: 0.1em; color: #a8935f;\">1 CORINTHIANS 10:31<\u002Fspan>\n      <\u002Fp>\n\n      <h1 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(40px, 6vw, 68px); line-height: 1.08; margin: 0 0 24px; color: #33392b;\">\n        Elegant Buffet Catering<br>for Every Occasion\n      <\u002Fh1>\n\n      <p style=\"font-size: 19px; color: #4d5a3f; max-width: 520px; margin: 0 auto 44px; line-height: 1.7;\">\n        From intimate gatherings to grand celebrations, we serve generous, beautifully presented buffets rooted in faith and hospitality.\n      <\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px 40px; margin-bottom: 44px;\">\n        <div style=\"text-align: center;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; color: #6f7d5e;\">Php 1,000<span style=\"font-size: 22px;\">.00<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.12em; color: #a8935f; text-transform: uppercase; margin-top: 4px;\">per pax<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width: 1px; height: 40px; background: #a8935f55;\"><\u002Fdiv>\n        <div style=\"text-align: left;\">\n          <div style=\"font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.08em; color: #33392b;\">Minimum 60 pax<\u002Fdiv>\n          <div style=\"font-size: 15px; color: #4d5a3f; margin-top: 2px;\">per event booking<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;\">\n        <a href=\"#menu\" style=\"font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; background: #6f7d5e; color: #f6f5ee; padding: 16px 36px; border-radius: 2px; box-shadow: 0 8px 24px -8px #6f7d5e88;\">View Full Menu<\u002Fa>\n        <a href=\"#contact\" style=\"font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; background: transparent; color: #4d5a3f; border: 1px solid #4d5a3f55; padding: 16px 36px; border-radius: 2px;\">Book a Consultation<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT STRIP -->\n  <section style=\"padding: 56px 24px; background: #4d5a3f; text-align: center;\">\n    <p style=\"max-width: 720px; margin: 0 auto; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 24px; line-height: 1.6; color: #f6f5ee;\">\n      Faith-rooted and family-run, we prepare generous, buffet-friendly spreads of Filipino and international favorites — cooked in large batches without losing the care of a home kitchen.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- MENU PREVIEW -->\n  <section id=\"menu\" style=\"padding: 110px 24px 100px; max-width: 1180px; margin: 0 auto;\">\n    <div style=\"text-align: center; margin-bottom: 64px;\">\n      <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; color: #a8935f; text-transform: uppercase; margin-bottom: 14px;\">Our Menu<\u002Fdiv>\n      <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(32px, 4.5vw, 48px); margin: 0 0 18px; color: #33392b;\">A Taste of the Table<\u002Fh2>\n      <p style=\"font-size: 17px; color: #4d5a3f; max-width: 520px; margin: 0 auto;\">Every buffet is customized to your event and guest count — choose your favorites from the full selection below.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px;\">\n      <sc-for list=\"{{ menuCategories }}\" as=\"cat\" hint-placeholder-count=\"8\">\n        <div style=\"background: #fffdf9; border: 1px solid #a8935f33; border-radius: 4px; padding: 32px 28px; position: relative;\">\n          <div style=\"font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6f7d5e; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #a8935f33;\">{{ cat.name }}<\u002Fdiv>\n          <sc-for list=\"{{ cat.items }}\" as=\"dish\" hint-placeholder-count=\"3\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; color: #33392b; padding: 5px 0; line-height: 1.4;\">{{ dish }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"text-align: center; margin-top: 52px;\">\n      <a href=\"#contact\" style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4d5a3f; text-decoration: none; border-bottom: 1px solid #a8935f88; padding-bottom: 4px;\">Inquire About Pricing &amp; Availability →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INCLUSIONS -->\n  <section style=\"padding: 100px 24px; background: #dfe6d4;\">\n    <div style=\"max-width: 1080px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 56px;\">\n        <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; color: #a8935f; text-transform: uppercase; margin-bottom: 14px;\">What's Included<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(32px, 4.5vw, 48px); margin: 0; color: #33392b;\">Everything You Need, Beautifully Arranged<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px;\">\n        <div style=\"background: #f6f5ee; border: 1px solid #a8935f33; border-radius: 4px; padding: 44px 40px;\">\n          <div style=\"font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #4d5a3f; margin-bottom: 10px;\">Standard Inclusions<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #4d5a3f; margin-bottom: 26px;\">Included with every booking<\u002Fdiv>\n          <sc-for list=\"{{ inclusions }}\" as=\"item\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 20px 0; border-top: 1px solid #a8935f33;\">\n              <div style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; color: #33392b;\">{{ item }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background: #33392b; border-radius: 4px; padding: 44px 36px; position: relative; overflow: hidden;\">\n          <div style=\"position: absolute; top: -80px; right: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #a8935f33 0%, transparent 70%);\"><\u002Fdiv>\n          <div style=\"position: relative;\">\n            <div style=\"font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8935f; margin-bottom: 10px;\">Special Inclusions<\u002Fdiv>\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #dfe6d4; margin-bottom: 26px;\">The centerpiece of every celebration<\u002Fdiv>\n            <sc-for list=\"{{ specialInclusions }}\" as=\"lechon\" hint-placeholder-count=\"2\">\n              <div style=\"padding: 20px 0; border-top: 1px solid #a8935f44;\">\n                <div style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; color: #f6f5ee;\">{{ lechon.name }}<\u002Fdiv>\n                <div style=\"font-size: 15px; color: #dfe6d4cc; margin-top: 4px;\">{{ lechon.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GALLERY / SOCIAL PROOF -->\n  <section style=\"padding: 110px 24px; max-width: 1180px; margin: 0 auto;\">\n    <div style=\"text-align: center; margin-bottom: 56px;\">\n      <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; color: #a8935f; text-transform: uppercase; margin-bottom: 14px;\">From Our Events<\u002Fdiv>\n      <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(32px, 4.5vw, 48px); margin: 0; color: #33392b;\">Moments Worth Gathering For<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; margin-bottom: 48px;\">\n      <sc-for list=\"{{ galleryPlaceholders }}\" as=\"slot\" hint-placeholder-count=\"4\">\n        <div style=\"aspect-ratio: 4/3; border-radius: 4px; border: 1px solid #a8935f44; background: repeating-linear-gradient(135deg, #dfe6d4 0px, #dfe6d4 10px, #f6f5ee 10px, #f6f5ee 20px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;\">\n          <span style=\"font-family: monospace; font-size: 12px; letter-spacing: 0.04em; color: #6f7d5e;\">{{ slot }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px;\">\n      <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <div style=\"background: #fffdf9; border: 1px solid #a8935f33; border-radius: 4px; padding: 36px 32px;\">\n          <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; line-height: 1.6; color: #33392b; margin: 0 0 18px;\">“{{ t.quote }}”<\u002Fp>\n          <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.08em; color: #a8935f; text-transform: uppercase;\">{{ t.author }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT / FOOTER -->\n  <section id=\"contact\" style=\"padding: 110px 24px 60px; background: #4d5a3f; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; top: -160px; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, #6f7d5e55 0%, transparent 70%);\"><\u002Fdiv>\n\n    <div style=\"position: relative; max-width: 1080px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 60px;\">\n        <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; color: #dfe6d4; text-transform: uppercase; margin-bottom: 14px;\">Let's Plan Your Event<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(32px, 4.5vw, 48px); margin: 0; color: #f6f5ee;\">Book a Consultation<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px;\">\n        <form style=\"display: flex; flex-direction: column; gap: 18px;\" sc-camel-on-submit=\"{{ handleSubmit }}\">\n          <input type=\"text\" placeholder=\"Full name\" style=\"background: #f6f5ee0d; border: 1px solid #dfe6d455; border-radius: 2px; padding: 14px 16px; font-family: 'EB Garamond', serif; font-size: 16px; color: #f6f5ee; outline: none;\">\n          <div style=\"display: flex; gap: 18px;\">\n            <input type=\"date\" style=\"flex: 1; background: #f6f5ee0d; border: 1px solid #dfe6d455; border-radius: 2px; padding: 14px 16px; font-family: 'EB Garamond', serif; font-size: 16px; color: #f6f5ee; outline: none;\">\n            <input type=\"number\" min=\"60\" placeholder=\"Guest count\" style=\"flex: 1; background: #f6f5ee0d; border: 1px solid #dfe6d455; border-radius: 2px; padding: 14px 16px; font-family: 'EB Garamond', serif; font-size: 16px; color: #f6f5ee; outline: none;\">\n          <\u002Fdiv>\n          <input type=\"email\" placeholder=\"Email address\" style=\"background: #f6f5ee0d; border: 1px solid #dfe6d455; border-radius: 2px; padding: 14px 16px; font-family: 'EB Garamond', serif; font-size: 16px; color: #f6f5ee; outline: none;\">\n          <textarea placeholder=\"Tell us about your event\" rows=\"3\" style=\"background: #f6f5ee0d; border: 1px solid #dfe6d455; border-radius: 2px; padding: 14px 16px; font-family: 'EB Garamond', serif; font-size: 16px; color: #f6f5ee; outline: none; resize: vertical;\"><\u002Ftextarea>\n          <button type=\"submit\" style=\"font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; background: #a8935f; color: #33392b; border: none; padding: 16px; border-radius: 2px; cursor: pointer; margin-top: 4px;\">Send Inquiry<\u002Fbutton>\n        <\u002Fform>\n\n        <div style=\"display: flex; flex-direction: column; gap: 28px; color: #dfe6d4; font-size: 16px;\">\n          <div>\n            <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; color: #a8935f; text-transform: uppercase; margin-bottom: 8px;\">Phone<\u002Fdiv>\n            <div>{{ contactPhone }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; color: #a8935f; text-transform: uppercase; margin-bottom: 8px;\">Email<\u002Fdiv>\n            <div>{{ contactEmail }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; color: #a8935f; text-transform: uppercase; margin-bottom: 8px;\">Serving Area<\u002Fdiv>\n            <div>{{ contactAddress }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; color: #a8935f; text-transform: uppercase; margin-bottom: 8px;\">Follow Us<\u002Fdiv>\n            <div style=\"display: flex; gap: 16px;\">\n              <a href=\"#\" style=\"color: #dfe6d4; text-decoration: none; border-bottom: 1px solid #dfe6d466;\">Facebook<\u002Fa>\n              <a href=\"#\" style=\"color: #dfe6d4; text-decoration: none; border-bottom: 1px solid #dfe6d466;\">Instagram<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"vine-divider\" style=\"margin: 72px 0 32px;\"><\u002Fdiv>\n\n      <p style=\"text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: #dfe6d4; max-width: 560px; margin: 0 auto 28px;\">\n        “So whatever you eat or drink or whatever you do, do it all for the glory of God” — 1 Corinthians 10:31\n      <\u002Fp>\n      <p style=\"text-align: center; font-size: 13px; color: #dfe6d488;\">© 2026 For His Glory Corporation. All rights reserved.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      menuCategories: [\n        { name: 'Soup', items: ['Pumpkin Soup', 'Broccoli Soup', 'Hototay', 'Birds Nest Soup', 'Mushroom Soup', 'Crab and Corn Soup', 'Egg Drop Soup', 'Corn and Chicken Soup', 'Cream of Mushroom', 'Hot and Sour Soup'] },\n        { name: 'Chicken', items: ['Oven-Baked Herb Chicken', 'Chicken Cordon Blue', 'Fried Chicken', 'Schnitzel', 'Chicken Inasal', 'Chicken Afritada', 'Chicken Adobo', 'Chicken Parmigiana', 'Hainanese Chicken', 'Chicken Katsu', 'Lemon Chicken', 'Baked Honey Garlic Chicken', 'Baked Chicken Thighs with Herbs'] },\n        { name: 'Seafoods', items: ['Mixed Seafoods (Cajun, Lemon Garlic Butter, Sweet & Spicy)', 'Sweet and Sour Fish', 'Boneless Bangus (Fried, Grilled, Baked)', 'Sinigang Salmon Belly', 'Fish Fillet in White Sauce', 'Bangus Steak', 'Fish Fillet with Sweet Chili Sauce'] },\n        { name: 'Beef', items: ['Braised Beef Steak', 'Caldereta', 'Nilaga', 'Pigar-Pigar', 'Salisbury Steak', 'Kare Kare', 'Sinigang', 'Beef Tapa (Shredded)', 'Beef with Broccoli'] },\n        { name: 'Vegetables', items: ['Garden Salad', 'Pinakbet', 'Stir Fried Vegies', 'Chopsuey', 'Green Salad', 'Four Seasons Vegies', 'Eggplant Parmigiana', 'Sauteed String Beans with Garlic', 'Buttered Corn and Carrots', 'Stir-Fried Bok Choy with Garlic', 'Roasted Root Vegetables'] },\n        { name: 'Sides / Pasta / Rice', items: ['Pancit: Miki Bihon', 'Sotanghon Guisado', 'Pesto Pasta', 'Spaghetti', 'Carbonara', 'Steamed Rice', 'Mashed Potato', 'Potatoes and Chives', 'Buttered Roasted Potatoes', 'Garlic Parmesan Mashed Potatoes', 'Penne Alfredo', 'Pomodoro'] },\n        { name: 'Dessert', items: ['Leche Flan', 'Buko Pandan', 'Parfait', 'Fresh Fruits', 'Macaroni Salad', 'Almond Lychee Jelly', 'Buko Rolls'] },\n        { name: 'Beverages', items: ['Fruit Juice', 'Brewed Coffee', 'Lemon Grass', 'Wintermelon Milk'] },\n      ],\n      inclusions: [\n        'Complete buffet set up with chafing dishes',\n        'Simple event decorations & centerpieces',\n        'Celebration cake',\n      ],\n      specialInclusions: [\n        { name: 'Lechon Baboy', desc: 'Whole roasted pig, carved tableside' },\n        { name: 'Lechon Baka', desc: 'Roasted beef, a signature centerpiece' },\n        { name: 'Grazing Table', desc: 'An artful spread of cheeses, fruits & bites' },\n      ],\n      galleryPlaceholders: ['event photo', 'buffet spread', 'table setup', 'guest reception'],\n      testimonials: [\n        { quote: 'The food was generous and beautifully presented — our guests are still talking about the lechon.', author: 'Wedding Client, Benguet' },\n        { quote: 'Professional, punctual, and every dish tasted homemade.', author: 'Government Client, Baguio' },\n      ],\n      contactPhone: '',\n      contactEmail: '',\n      contactAddress: 'Baguio City & nearby areas',\n      handleSubmit: (e) => { e.preventDefault(); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
